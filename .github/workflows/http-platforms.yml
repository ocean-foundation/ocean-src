name: Native standard-library platforms

on:
  pull_request:
    paths: ['**/*.oc', '**/tests/**', '.github/workflows/http-platforms.yml', '.github/scripts/**']
  push:
    branches: ['**'] # Snapshot tags are verified by the compiler release workflow.
    paths: ['**/*.oc', '**/tests/**', '.github/workflows/http-platforms.yml', '.github/scripts/**']
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: 'Ocean compiler revision to build and test'
        default: 8beb5ae5b071b73f541cffcef799aed0473effcc
        required: true

env:
  PYTHONUTF8: "1"
  BOOTSTRAP_REPO: ocean-foundation/ocean-c
  BOOTSTRAP_TAG: nightly-2026.11.22

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, os: linux }
          - { runner: ubuntu-24.04-arm, arch: aarch64, os: linux }
          - { runner: macos-15-intel, arch: x86_64, os: macos }
          - { runner: macos-15, arch: aarch64, os: macos }
          - { runner: windows-2025, arch: x86_64, os: windows, msystem: CLANG64, prefix: mingw-w64-clang-x86_64 }
          - { runner: windows-11-arm, arch: aarch64, os: windows, msystem: CLANGARM64, prefix: mingw-w64-clang-aarch64 }
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ocean-src
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: ocean-foundation/ocean
          ref: ${{ inputs.compiler_ref || '8beb5ae5b071b73f541cffcef799aed0473effcc' }}
          path: ocean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download bootstrap compiler
        working-directory: ocean
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py bootstrap --repo "$BOOTSTRAP_REPO" --tag "$BOOTSTRAP_TAG" --target "${{ matrix.arch }}-${{ matrix.os }}"
      - if: matrix.os == 'linux'
        name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg libffi-dev libcurl4-openssl-dev openssl pkg-config
          bash ocean-src/.github/scripts/install-llvm.sh
      - if: matrix.os == 'macos'
        name: macOS dependencies
        run: |
          brew install llvm libffi openssl@3 pkgconf
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          echo "LIBRARY_PATH=$(brew --prefix libffi)/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix libffi)/lib" >> "$GITHUB_ENV"
      - if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            make
            ${{ matrix.prefix }}-clang
            ${{ matrix.prefix }}-llvm
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-libffi
            ${{ matrix.prefix }}-curl
            ${{ matrix.prefix }}-openssl
            ${{ matrix.prefix }}-python
      - if: matrix.os != 'windows'
        name: Build and test Unix
        run: |
          set -euo pipefail
          clang --version
          llvm-ar --version
          export OCEAN_SRC="$GITHUB_WORKSPACE/ocean-src"
          make -C ocean OCEAN=build/bootstrap/ocean
          ocean/build/ocean test ocean-src/... --notty --timeout 30s
          python3 ocean-src/net/http/tests/integration.py ocean/build/ocean
          python3 ocean-src/net/http/tests/integration.py ocean/build/ocean --cache "$RUNNER_TEMP/http-cache"
          export OCEAN="$PWD/ocean/build/ocean"
          python3 ocean-src/os/signal/tests/test_signal.py
          python3 ocean-src/term/tests/test_term.py
          python3 ocean-src/term/tui/tests/test_tui.py
          python3 ocean-src/threads/tests/test_threads.py
          python3 ocean-src/time/tests/test_time.py
          python3 ocean-src/os/tests/remove_all/test_remove_all.py ocean/build/ocean
          python3 ocean-src/net/http/tests/linking.py ocean/build/ocean
      - if: matrix.os == 'windows'
        name: Build and test Windows
        shell: msys2 {0}
        run: |
          set -euo pipefail
          clang --version
          llvm-ar --version
          export OCEAN_SRC="$(cygpath -m "$PWD/ocean-src")"
          if [[ ! -f "$MINGW_PREFIX/bin/pkg-config.exe" ]]; then
            cp "$MINGW_PREFIX/bin/pkgconf.exe" "$MINGW_PREFIX/bin/pkg-config.exe"
          fi
          make -C ocean OCEAN=build/bootstrap/ocean.exe
          ocean/build/ocean.exe check ocean-src/testing/internal/display
          ocean/build/ocean.exe test ocean-src/... --notty --timeout 30s
          python ocean-src/os/exec/tests/integration.py ocean/build/ocean.exe
          python ocean-src/net/http/tests/integration.py ocean/build/ocean.exe
          python ocean-src/net/http/tests/integration.py ocean/build/ocean.exe --cache "$(cygpath -m "$RUNNER_TEMP/http-cache")"
          python ocean-src/net/http/tests/linking.py ocean/build/ocean.exe
  wasm:
    runs-on: ubuntu-24.04
    name: JavaScript-Wasm and foreign assembly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ocean-src
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: ocean-foundation/ocean
          ref: ${{ inputs.compiler_ref || '8beb5ae5b071b73f541cffcef799aed0473effcc' }}
          path: ocean
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg libffi-dev libcurl4-openssl-dev pkg-config
          bash ocean-src/.github/scripts/install-llvm.sh
      - name: Download bootstrap compiler
        working-directory: ocean
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py bootstrap --repo "$BOOTSTRAP_REPO" --tag "$BOOTSTRAP_TAG" --target x86_64-linux
      - name: Compile and execute Wasm smoke tests
        run: |
          set -euo pipefail
          clang --version
          llvm-ar --version
          export OCEAN_SRC="$GITHUB_WORKSPACE/ocean-src"
          make -C ocean OCEAN=build/bootstrap/ocean
          python3 ocean-src/net/http/tests/wasm.py ocean/build/ocean
          python3 ocean-src/net/http/tests/assembly.py ocean/build/ocean "$(command -v clang)"
  riscv64:
    runs-on: ubuntu-24.04
    name: linux-riscv64 (QEMU)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ocean-src
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: ocean-foundation/ocean
          ref: ${{ inputs.compiler_ref || '8beb5ae5b071b73f541cffcef799aed0473effcc' }}
          path: ocean
      - name: Download RISC-V bootstrap compiler
        working-directory: ocean
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py bootstrap --repo "$BOOTSTRAP_REPO" --tag "$BOOTSTRAP_TAG" --target riscv64-linux
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - name: Build and run in RISC-V64 Linux
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: none
          distro: none
          base_image: --platform=linux/riscv64 riscv64/ubuntu:26.04
          install: |
            apt-get update
            apt-get install -y clang-21 lld-21 llvm-21 binutils libffi-dev libcurl4-openssl-dev openssl make pkg-config python3
          run: |
            set -eu
            mkdir -p /tmp/ocean-tools
            for tool in clang wasm-ld ld.lld llvm-ar llvm-ranlib; do ln -sf "/usr/bin/$tool-21" "/tmp/ocean-tools/$tool"; done
            export PATH="/tmp/ocean-tools:$PATH" PYTHONUTF8=1
            export OCEAN_HTTP_BUILD_TIMEOUT=900
            clang --version
            export OCEAN_SRC="$PWD/ocean-src"
            make -C ocean OCEAN=build/bootstrap/ocean
            ocean/build/ocean test ocean-src/... --notty --timeout 60s
            OCEAN_HTTP_TIMING_SCALE=5 python3 ocean-src/net/http/tests/integration.py ocean/build/ocean
            python3 ocean-src/net/http/tests/linking.py ocean/build/ocean
